services:
  mariadb:
    image: mariadb:10.11.11
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:-MariaRootLocal123!}
      MARIADB_DATABASE: moodle
      MARIADB_USER: moodle
      MARIADB_PASSWORD: ${MOODLE_DB_PASSWORD:-MoodleDatabaseLocal123!}
    command: [--character-set-server=utf8mb4, --collation-server=utf8mb4_unicode_ci]
    volumes: [moodle-db:/var/lib/mysql]
    healthcheck:
      test: [CMD, healthcheck.sh, --connect, --innodb_initialized]
      interval: 5s
      timeout: 5s
      retries: 40
    networks: [moodle]
  moodle:
    build:
      context: ../..
      dockerfile: deploy/moodle/Dockerfile
    restart: unless-stopped
    environment:
      MOODLE_URL: ${MOODLE_URL:-http://localhost:18082}
      MOODLE_DB_PASSWORD: ${MOODLE_DB_PASSWORD:-MoodleDatabaseLocal123!}
      MOODLE_ADMIN_USER: ${MOODLE_ADMIN_USER:-admin}
      MOODLE_ADMIN_PASSWORD: ${MOODLE_ADMIN_PASSWORD:-AdminLocal123!}
      MOODLE_ADMIN_EMAIL: ${MOODLE_ADMIN_EMAIL:-admin@example.com}
      MOODLE_STUDENT_PASSWORD: ${MOODLE_STUDENT_PASSWORD:-StudentLocal123!}
      MOODLE_TEACHER_PASSWORD: ${MOODLE_TEACHER_PASSWORD:-TeacherLocal123!}
      COLLECTOR_API_URL: ${COLLECTOR_API_URL:-http://localhost:18081/api}
    ports: ['127.0.0.1:${MOODLE_PORT:-18082}:80']
    volumes: [moodle-data:/var/www/moodledata]
    depends_on:
      mariadb: {condition: service_healthy}
    healthcheck:
      test: [CMD, curl, -fsS, 'http://localhost/health.php']
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 120s
    networks: [moodle]
volumes:
  moodle-db:
  moodle-data:
networks:
  moodle:
