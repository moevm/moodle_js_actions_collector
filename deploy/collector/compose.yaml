services:
  mongodb:
    image: mongo:8.0.13
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:-collectorroot}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-MongoLocal123!}
      MONGO_INITDB_DATABASE: ${MONGODB_DATABASE:-moodle-statistics}
      COLLECTOR_ADMIN_EMAIL: ${COLLECTOR_ADMIN_EMAIL:-collector@example.com}
      COLLECTOR_ADMIN_PASSWORD: ${COLLECTOR_ADMIN_PASSWORD:-CollectorLocal123!}
    volumes:
      - collector-db:/data/db
      - ./mongo-init.js:/docker-entrypoint-initdb.d/01-collector.js:ro
    healthcheck:
      test: [CMD-SHELL, 'mongosh --quiet -u "$$MONGO_INITDB_ROOT_USERNAME" -p "$$MONGO_INITDB_ROOT_PASSWORD" --authenticationDatabase admin --eval "quit(db.adminCommand({ping:1}).ok ? 0 : 1)"']
      interval: 5s
      timeout: 10s
      retries: 40
    networks: [collector]
  backend:
    build:
      context: ../../server
    restart: unless-stopped
    environment:
      MONGODB_ROOT_USER: ${MONGO_ROOT_USER:-collectorroot}
      MONGODB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-MongoLocal123!}
      MONGODB_DATABASE: ${MONGODB_DATABASE:-moodle-statistics}
      CORS_ORIGINS: ${MOODLE_URL:-http://localhost:18082}
      TZ: UTC
    ports: ['127.0.0.1:${COLLECTOR_API_PORT:-18080}:8080']
    depends_on:
      mongodb: {condition: service_healthy}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/api/healthcheck/', timeout=5)"]
      interval: 5s
      timeout: 10s
      retries: 40
    networks: [collector]
  frontend:
    build:
      context: ../../client
    restart: unless-stopped
    ports: ['127.0.0.1:${COLLECTOR_PORT:-18081}:8080']
    depends_on:
      backend: {condition: service_healthy}
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, 'http://127.0.0.1:8080/']
      interval: 5s
      timeout: 5s
      retries: 30
    networks: [collector]
volumes:
  collector-db:
networks:
  collector:
