worker_processes auto;
events { worker_connections 1024; }
http {
  include /etc/nginx/mime.types;
  limit_req_zone $binary_remote_addr zone=collector_login:1m rate=1r/s;
  server {
    listen 8080;
    root /usr/share/nginx/html/app;
    location / { try_files $uri $uri/ /index.html; }
    location = /api/auth/sign-in {
      client_max_body_size 16k;
      limit_req zone=collector_login burst=10 nodelay;
      limit_req_status 429;
      error_page 429 = @login_limited;
      proxy_pass http://backend:8080;
    }
    location @login_limited {
      default_type application/json;
      add_header Retry-After 1 always;
      add_header Cache-Control no-store always;
      return 429 '{"detail":"Too many sign-in attempts; retry later"}';
    }
    location /api/ {
      proxy_pass http://backend:8080/api/;
      client_max_body_size 2m;
    }
  }
}
