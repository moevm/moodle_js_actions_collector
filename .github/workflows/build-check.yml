name: Docker builds
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Validate and build services
        run: |
          cp .env.example .env
          docker compose config --quiet
          docker compose build
